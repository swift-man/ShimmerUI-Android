name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # actions/setup-java@v5
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36"

      # gradle/actions/setup-gradle@v5
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Build and test
        run: |
          ./gradlew \
            :shimmer-ui:lintDebug \
            :shimmer-ui:testDebugUnitTest \
            :shimmer-ui:dokkaGeneratePublicationHtml \
            :sample:assembleDebug \
            --stacktrace
