name: Deploy Dokka

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dokka-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # actions/setup-java@v5
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37"

      # gradle/actions/setup-gradle@v5
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Build Dokka
        run: |
          ./gradlew :shimmer-ui:dokkaGeneratePublicationHtml --stacktrace
          test -f shimmer-ui/build/dokka/html/index.html

      - name: Deploy to swift-man/docs
        # peaceiris/actions-gh-pages@v4.1.0
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
          external_repository: swift-man/docs
          publish_branch: main
          publish_dir: shimmer-ui/build/dokka/html
          destination_dir: ShimmerUI-Android
          keep_files: false
          full_commit_message: Deploy ShimmerUI Android Dokka from ${{ github.repository }}@${{ github.sha }}
